# Module options for the GB10 CPU-core DMA bridge.
#   cores        CPUs to dedicate as copy engines (cpulist). On DGX Spark the
#                Cortex-A725 clusters are 0-4 and 10-14; X925 are 5-9 and 15-19.
#   poll_us      busy-poll window before an idle engine sleeps (0 = never spin)
#   rt           run engines SCHED_FIFO (1) or normal priority (0)
#   io_coherent  peers are I/O coherent so FLUSH is a no-op (1 on GB10)
#   peer_bdf     default PCI function used to attach dma-bufs (default: the GPU)
options gb10_dmab cores=16-19 poll_us=200 rt=1 io_coherent=1
